<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ultimate Dynamic Wallpaper</title>
<style>
    /* --- BASE STYLES --- */
    html, body { margin: 0; padding: 0; background: #000; overflow: hidden; height: 100%; width: 100%; font-family: 'Segoe UI', system-ui, sans-serif; color: #fff; cursor: pointer; }
    #wall1, #wall2 { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; opacity: 0; transition: opacity 2s ease-in-out; will-change: opacity; pointer-events: none; }

    /* --- PROGRESS & STATUS --- */
    #progress-container { position: fixed; top: 0; left: 0; width: 100%; height: 3px; background: rgba(255,255,255,0.1); z-index: 1000; opacity: 0; transition: opacity 0.3s; }
    #progress-bar { height: 100%; width: 0%; background: #0078D4; transition: width 0.4s ease; }
    #status { position: fixed; bottom: 20px; left: 20px; color: white; background: rgba(0,0,0,0.85); padding: 12px 18px; border-radius: 8px; font-size: 13px; z-index: 100; opacity: 0; transition: opacity 0.3s ease; border: 1px solid rgba(255,255,255,0.1); pointer-events: none; }

    /* --- WEATHER OVERLAY --- */
    #weather-overlay {
        position: fixed; top: 20px; right: 20px; color: white;
        background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
        padding: 20px; border-radius: 10px; z-index: 100;
        font-size: 16px; min-width: 280px; text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
        pointer-events: none; text-align: left;
    }
    #datetime { font-size: 28px; font-weight: 300; margin-bottom: 10px; white-space: pre-line; }
    #location { font-size: 14px; margin-bottom: 15px; opacity: 0.9; font-weight: 600; letter-spacing: 0.5px; }
    #weather-info { display: flex; align-items: center; gap: 15px; }
    #weather-icon { font-size: 48px; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.8)); }
    #weather-details { display: flex; flex-direction: column; gap: 5px; }
    #temperature { font-size: 28px; font-weight: bold; }
    #weather-description { font-size: 14px; opacity: 0.9; white-space: pre-line; }

    /* --- SETTINGS SIDEBAR --- */
    #web-settings { position: fixed; top: 0; left: 0; height: 100vh; width: 320px; background: rgba(15, 15, 15, 0.95); backdrop-filter: blur(15px); transform: translateX(-310px); transition: transform 0.3s ease; padding: 30px 25px; box-sizing: border-box; z-index: 200; overflow-y: auto; cursor: default; }
    #web-settings:hover { transform: translateX(0); }
    .setting-group { margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px; }
    .setting-group label { font-size: 11px; color: #888; font-weight: 700; text-transform: uppercase; }
    select, input { width: 100%; padding: 10px; background: #222; border: 1px solid #444; color: #fff !important; border-radius: 5px; outline: none; }
    .btn-primary { background: #0078D4; color: white; border: none; padding: 12px; font-weight: bold; width: 100%; cursor: pointer; border-radius: 5px; margin-top: 10px; }
    .btn-secondary { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.1); padding: 8px; font-size: 12px; cursor: pointer; border-radius: 4px; margin-top: 5px; }
    .btn-control { flex: 1; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .info-box { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 6px; border-left: 3px solid #0078D4; margin-top: 20px; font-size: 13px; }
</style>
</head>
<body onclick="showNextWallpaper()">

<div id="progress-container"><div id="progress-bar"></div></div>
<img id="wall1"><img id="wall2">
<div id="status"></div>

<div id="weather-overlay">
    <div id="datetime"></div>
    <div id="location">Detecting Location...</div>
    <div id="weather-info">
        <div id="weather-icon">🌤️</div>
        <div id="weather-details">
            <div id="temperature">--°C / --°F</div>
            <div id="weather-description">Loading weather...</div>
        </div>
    </div>
</div>

<div id="web-settings" onclick="event.stopPropagation()">
    <h2 style="font-weight: 300; margin-top: 0;">Settings</h2>
    
    <div class="setting-group">
        <label>Image Provider</label>
        <select id="ui-source">
            <option value="wallhaven">Wallhaven</option>
            <option value="bing">Bing Images</option>
            <option value="nasa">NASA APOD</option>
            <option value="unsplash">Unsplash</option>
            <option value="spotlight">Windows Spotlight</option>
        </select>
    </div>

    <div class="setting-group">
        <label>Weather Data</label>
        <button id="ui-weather-refresh" class="btn-secondary">🔄 Refresh Weather & Location</button>
    </div>

    <div class="setting-group">
        <label>Auto-Fetch Batch Every</label>
        <select id="ui-cache-hours">
            <option value="1">1 Hour</option>
            <option value="6">6 Hours</option>
            <option value="12">12 Hours</option>
            <option value="24">24 Hours</option>
        </select>
    </div>

    <div class="setting-group">
        <label>Cycle Rotation (Minutes)</label>
        <input type="number" id="ui-interval" min="1" max="60" value="3">
    </div>

    <div id="wallhaven-options" class="setting-group">
        <label>Wallhaven Category</label>
        <select id="ui-category">
            <option value="100">General</option>
            <option value="010">Anime</option>
            <option value="001">People</option>
            <option value="111">Everything</option>
        </select>
    </div>

    <div id="unsplash-options" class="setting-group">
        <label>Unsplash Access Key</label>
        <input type="text" id="ui-unsplash-key" placeholder="Paste Key Here">
    </div>

    <button id="ui-refresh" class="btn-primary">Force Refresh Cache</button>

    <div class="info-box">
        <p>Last Sync: <b id="ui-last-sync">Never</b></p>
        <p>Batch Size: <b id="ui-img-count">0</b></p>
        <div style="display:flex; gap:8px; margin-top:10px;">
            <button class="btn-control" onclick="showPrevWallpaper()">◀ Prev</button>
            <button class="btn-control" onclick="showNextWallpaper()">Next ▶</button>
        </div>
    </div>
</div>

<script>
// ==========================================
// 1. STATE & CONFIG
// ==========================================
let config = JSON.parse(localStorage.getItem('web_cfg')) || { 
    source: "wallhaven", cat: "100", interval: 3, cache: 12, key: "" 
};

const PROXY = "https://api.allorigins.win/raw?url=";
let wallpapers = [], currentIndex = 0, showingFirst = true, cycleTimer = null;

function updateStatus(msg, isErr = false) {
    const s = document.getElementById('status'); s.textContent = msg; s.style.opacity = '1';
    if (!isErr) setTimeout(() => s.style.opacity = '0', 3000);
}
function updateProgress(pct) {
    const b = document.getElementById('progress-bar'), c = document.getElementById('progress-container');
    c.style.opacity = (pct > 0 && pct < 100) ? '1' : '0'; b.style.width = pct + '%';
}

// ==========================================
// 2. WEATHER ENGINE
// ==========================================
const wmoCodes = { 0: ["Clear Sky", "☀️"], 1: ["Mainly Clear", "🌤️"], 2: ["Partly Cloudy", "⛅"], 3: ["Overcast", "☁️"], 45: ["Foggy", "🌫️"], 61: ["Light Rain", "🌧️"], 95: ["Thunderstorm", "⛈️"] };

async function updateWeather() {
    updateStatus("Updating Weather...");
    try {
        const geo = await (await fetch('https://ipapi.co/json/')).json();
        document.getElementById('location').textContent = `${geo.city}, ${geo.region}`;
        const w = await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${geo.latitude}&longitude=${geo.longitude}&current=temperature_2m,weather_code&temperature_unit=celsius`)).json();
        const tempC = Math.round(w.current.temperature_2m);
        const tempF = Math.round((tempC * 9/5) + 32);
        const [desc, icon] = wmoCodes[w.current.weather_code] || ["Settled", "🌤️"];
        document.getElementById('temperature').textContent = `${tempC}°C / ${tempF}°F`;
        document.getElementById('weather-description').textContent = desc;
        document.getElementById('weather-icon').textContent = icon;
    } catch (e) {
        updateStatus("Weather Sync Failed", true);
    }
}

// ==========================================
// 3. FETCH ENGINE
// ==========================================
async function safeFetch(url, useProxy = false) {
    const target = useProxy ? PROXY + encodeURIComponent(url) : url;
    updateProgress(30);
    try {
        const r = await fetch(target); if (!r.ok) throw new Error(`HTTP ${r.status}`);
        updateProgress(60); return await r.json();
    } catch (e) { throw new Error(e.message); }
}

const Providers = {
    wallhaven: async () => {
        const d = await safeFetch(`https://wallhaven.cc/api/v1/search?categories=${config.cat}&purity=100&atleast=1920x1080&sorting=random`, true);
        return d.data.map(i => i.path);
    },
    bing: async () => {
        const d = await safeFetch("https://www.bing.com/HPImageArchive.aspx?format=js&idx=0&n=8", true);
        return d.images.map(i => "https://www.bing.com" + i.url);
    },
    nasa: async () => {
        const d = await safeFetch(`https://api.nasa.gov/planetary/apod?api_key=DEMO_KEY&count=5`, false);
        return d.filter(i => i.media_type === "image").map(i => i.hdurl || i.url);
    },
    unsplash: async () => {
        if (!config.key) throw new Error("Key Required");
        const d = await safeFetch(`https://api.unsplash.com/photos/random?orientation=landscape&count=5&client_id=${config.key}`, false);
        return d.map(i => i.urls.full);
    },
    spotlight: async () => {
        const d = await safeFetch('https://arc.msn.com/v3/Delivery/Placement?pid=209567&fmt=json', true);
        const urls = []; d.batchrsp?.items?.forEach(i => { try { const inner = JSON.parse(i.item); urls.push(inner.ad?.image_fullscreen_001_landscape?.u); } catch(e){} });
        return urls.filter(u => u);
    }
};

// ==========================================
// 4. CORE ENGINE
// ==========================================
async function init() {
    updateStatus(`Syncing ${config.source}...`);
    document.getElementById('wallhaven-options').style.display = (config.source === 'wallhaven') ? 'flex' : 'none';
    document.getElementById('unsplash-options').style.display = (config.source === 'unsplash') ? 'flex' : 'none';

    const now = Date.now();
    const cacheKey = `cache_${config.source}_imgs`;
    const timeKey = `cache_${config.source}_time`;
    const stampKey = `cache_${config.source}_stamp`;

    const cached = localStorage.getItem(cacheKey);
    const cachedTime = localStorage.getItem(timeKey);
    const isStale = !cachedTime || (now - parseInt(cachedTime) > (config.cache * 3600000));

    try {
        if (isStale || !cached) {
            wallpapers = await Providers[config.source]();
            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            localStorage.setItem(cacheKey, JSON.stringify(wallpapers));
            localStorage.setItem(timeKey, now.toString());
            localStorage.setItem(stampKey, timeStr);
            updateStatus("Fresh Batch Loaded");
        } else {
            wallpapers = JSON.parse(cached);
            updateStatus("Loaded from Cache");
        }
        
        document.getElementById('ui-img-count').textContent = wallpapers.length;
        document.getElementById('ui-last-sync').textContent = localStorage.getItem(stampKey);
        transition(wallpapers[0]);
    } catch (e) { updateStatus(`Error: ${e.message}`, true); updateProgress(0); }
}

function transition(url) {
    updateProgress(75); const p = new Image();
    p.onload = () => {
        updateProgress(100); const w1 = document.getElementById('wall1'), w2 = document.getElementById('wall2');
        if (showingFirst) { w2.src = url; w2.style.opacity = 1; w1.style.opacity = 0; }
        else { w1.src = url; w1.style.opacity = 1; w2.style.opacity = 0; }
        showingFirst = !showingFirst; resetTimer();
    };
    p.src = url;
}

function showNextWallpaper() { if (wallpapers.length) { currentIndex = (currentIndex + 1) % wallpapers.length; transition(wallpapers[currentIndex]); } }
function showPrevWallpaper() { if (wallpapers.length) { currentIndex = (currentIndex - 1 + wallpapers.length) % wallpapers.length; transition(wallpapers[currentIndex]); } }
function resetTimer() { if (cycleTimer) clearInterval(cycleTimer); cycleTimer = setInterval(showNextWallpaper, config.interval * 60000); }

// ==========================================
// 5. BOOT
// ==========================================
window.onload = () => {
    document.getElementById('ui-source').value = config.source;
    document.getElementById('ui-category').value = config.cat;
    document.getElementById('ui-interval').value = config.interval;
    document.getElementById('ui-cache-hours').value = config.cache;
    document.getElementById('ui-unsplash-key').value = config.key;

    init(); updateWeather();
    setInterval(() => {
        const n = new Date();
        document.getElementById('datetime').textContent = n.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) + "\n" + n.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
    }, 1000);

    document.getElementById('ui-weather-refresh').onclick = updateWeather;
    document.getElementById('ui-refresh').onclick = () => { localStorage.removeItem(`cache_${config.source}_time`); init(); };
    document.getElementById('ui-source').onchange = (e) => { config.source = e.target.value; save(); init(); };
    document.getElementById('ui-category').onchange = (e) => { config.cat = e.target.value; save(); init(); };
    document.getElementById('ui-interval').onchange = (e) => { config.interval = e.target.value; save(); resetTimer(); };
    document.getElementById('ui-cache-hours').onchange = (e) => { config.cache = parseInt(e.target.value); save(); };
    document.getElementById('ui-unsplash-key').onchange = (e) => { config.key = e.target.value; save(); };
    function save() { localStorage.setItem('web_cfg', JSON.stringify(config)); }
};
</script>
</body>
</html>
